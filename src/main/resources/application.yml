spring:
  application:
    name: food-rescue
  profiles:
    # "dev" loads sample data (see DevDataSeeder). Use SPRING_PROFILES_ACTIVE=postgres in production.
    default: dev
  datasource:
    # PostgreSQL compatibility mode, so the same Flyway migrations run on H2 and in production.
    url: jdbc:h2:mem:foodrescue;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway creates the schema (src/main/resources/db/migration); Hibernate only checks at
      # startup that the entities match it, and refuses to start if they do not.
      ddl-auto: validate
    # Disable open-in-view so lazy loading cannot silently happen inside controllers.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      # Food photos; FoodItemPhotoService also checks the size and the real image type.
      max-file-size: 3MB
      max-request-size: 3MB

# Business rules, bound to FoodRescueProperties.
foodrescue:
  max-search-radius-km: 25
  reservation-window-minutes: 60
  pay-it-forward-daily-limit: 1
  max-quantity-per-reservation: 5
  expiry-job-delay-ms: 60000

  # How often the daily-digest job looks for customers whose digest time has come.
  digest-job-delay-ms: 300000

  # Streaks, achievements and the community challenge, bound to GamificationProperties.
  gamification:
    # Items the whole community tries to rescue each month (the challenge on the Impact page).
    monthly-challenge-units: 400

  # Uploaded photos are saved as files here, bound to UploadProperties. Relative to the folder the
  # program is started from; set FOODRESCUE_UPLOADS_DIR to keep them somewhere else.
  uploads:
    dir: ${FOODRESCUE_UPLOADS_DIR:uploads}

  # Web Push, bound to PushProperties. Free: messages go straight to the browsers' push services.
  push:
    enabled: true
    # Generate once (for example with "npx web-push generate-vapid-keys") and keep them fixed;
    # browsers must subscribe again whenever they change. Without them, temporary keys are used.
    public-key: ${FOODRESCUE_PUSH_PUBLIC_KEY:}
    private-key: ${FOODRESCUE_PUSH_PRIVATE_KEY:}
    # Push services contact this address if something goes wrong. Set a real address.
    subject: mailto:${FOODRESCUE_CONTACT_EMAIL:push-contact@example.org}
    allowed-hosts:
      - fcm.googleapis.com
      - .push.services.mozilla.com
      - .push.apple.com
      - .notify.windows.com
    allow-insecure-endpoints: false

  # Login tokens, bound to SecurityProperties.
  security:
    # Signs the login tokens. The dev value below is public, so production MUST set
    # FOODRESCUE_JWT_SECRET to a random string of at least 32 characters.
    jwt-secret: ${FOODRESCUE_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    token-validity-hours: 168

  # Accounts, bound to AccountProperties.
  accounts:
    # The address people open the app at; used in the links of emails.
    public-url: ${FOODRESCUE_PUBLIC_URL:http://localhost:8080}
    # Sender of emails, e.g. "Food Rescue <hello@example.org>". Emails (password reset) are sent
    # only when this and a mail server (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
    # SPRING_MAIL_PASSWORD) are set; until then "forgot password" is not offered.
    mail-from: ${FOODRESCUE_MAIL_FROM:}
    log-reset-links: false
    # Limits on repeated sign-in, sign-up and password reset attempts.
    rate-limits: true

  # Address lookup, bound to GeocodingProperties.
  geocoding:
    enabled: true
    # OpenStreetMap's free geocoder. Its usage policy allows about one request per second and
    # asks for an identifying User-Agent; for real traffic use a paid provider or host your own.
    base-url: https://nominatim.openstreetmap.org
    user-agent: food-rescue/0.1 (${FOODRESCUE_CONTACT_EMAIL:local development})
    # Limits results to these countries (ISO codes, comma separated); empty means worldwide.
    country-codes: ro

spring.mail.properties.mail.smtp:
  # Mail servers on port 587 expect STARTTLS; a slow one must not hold a request forever.
  starttls.enable: true
  connectiontimeout: 10000
  timeout: 10000
  writetimeout: 10000

spring.web.resources.cache.cachecontrol:
  # app.js and styles.css keep their names between versions, so browsers must check for a new
  # one each time (a quick "not modified" answer when nothing changed).
  no-cache: true

spring.lifecycle.timeout-per-shutdown-phase: 20s

server:
  # Finish requests in progress before stopping (for example during a new deployment).
  shutdown: graceful
  # Behind a reverse proxy or load balancer that ends HTTPS: trust its X-Forwarded-* headers
  # (only from private network addresses), so links, secure cookies and client addresses are right.
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,application/problem+json,image/svg+xml,application/manifest+json
  # So browsers accept the install manifest of the web app.
  mime-mappings:
    webmanifest: application/manifest+json
  error:
    include-stacktrace: never
